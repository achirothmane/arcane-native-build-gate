name: Arcane Native Build Gate (read-only upstream)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-native-build-gate.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v2.10.2
            commit: 670ee2b34ea7b0fb2917643229b6ce9070ee9742
          - version: v2.12.0
            commit: 3089c2ec4a56da5ca934c37778e6aeb2f539862d
          - version: v2.14.0
            commit: 89619a824ea71bd39cada912cdbe660ee4df7176
    runs-on: ubuntu-latest
    timeout-minutes: 35
    name: ${{ matrix.version }} - baseline vs candidate
    steps:
      - name: Fetch experiment repository
        uses: actions/checkout@v4
        with:
          path: experiment
          persist-credentials: false
      - name: Fetch exact Arcane source (no fork)
        uses: actions/checkout@v4
        with:
          repository: getarcaneapp/arcane
          ref: ${{ matrix.commit }}
          path: arcane
          persist-credentials: false
      - name: Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install pinned project pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: arcane/package.json
          run_install: false
      - name: Native baseline and candidate compilation
        run: |
          cp -r experiment/scripts ./scripts
          bash scripts/ci_gate.sh '${{ matrix.version }}'
      - name: Preserve evidence on pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-arcane-${{ matrix.version }}
          path: evidence/
          if-no-files-found: warn
