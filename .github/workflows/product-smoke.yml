name: Product — clean installation and real HTTP Chromium smoke
on:
  push:
    branches: [main]
    paths:
      - 'product/**'
      - '.github/workflows/product-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone package on clean runner
        run: |
          python -m pip install ./product
          python -m pip install pytest
          python -m playwright install --with-deps chromium
      - name: Unit and isolated browser tests
        run: |
          python -m pytest -q product/tests/test_gate.py
      - name: Actual localhost HTTP integration + evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8777 --bind 127.0.0.1 --directory product/tests/fixtures > /tmp/lrg-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 15); do if curl -fsS http://127.0.0.1:8777/good.html >/dev/null; then break; fi; sleep 1; done
          set +e
          lrg --config product/examples/live-bad.json --output evidence/bad
          BAD_STATUS=$?
          lrg --config product/examples/live-good.json --output evidence/good
          GOOD_STATUS=$?
          set -e
          echo "bad_exit=$BAD_STATUS good_exit=$GOOD_STATUS"
          test "$BAD_STATUS" -eq 1
          test "$GOOD_STATUS" -eq 0
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/bad/report.json').read_text())
          b=json.loads(Path('evidence/good/report.json').read_text())
          assert a['status']=='FAIL' and b['status']=='PASS'
          assert 'TEXT_ICON_OVERLAP' in {x['type'] for r in a['results'] for x in r['findings']}
          print('HTTP_CHROMIUM_SMOKE_PASS')
          PY
      - name: Save local evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-smoke-localhost
          path: evidence/
          if-no-files-found: warn
